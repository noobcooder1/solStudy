<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>랜덤 이미지 출력</title>
    <link rel="stylesheet" href="aa.css"> <!-- CSS 연결 -->
</head>

<body>
    <div id="output"></div> <!-- 출력 영역 -->

    <script src="aa.js">
        let a = prompt("1부터 3까지의 수를 입력해주세요.");
        switch (a) {
            case 1:
                document.write("1");
                break;
            case 2:
                document.write("2");
                break;
            default:
                document.write("3");
        }

    </script> <!-- JS 연결 -->
</body>

</html>
